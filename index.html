<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแสดงข้อมูลสารสนเทศโรงเรียน (Sandbox)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
            padding-top: 30px;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .table-responsive {
            max-height: 70vh;
        }
        /* ล็อกหัวตารางให้อยู่กับที่เวลาเลื่อนลง */
        thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="container-fluid px-4">
    <div class="card mb-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">📊 ข้อมูลโรงเรียนที่ผ่านการอนุมัติหลักสูตร (Sandbox)</h4>
            <span class="badge bg-light text-dark" id="rowCount">กำลังโหลดข้อมูล...</span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered" id="dataTable">
                    <thead class="table-dark" id="tableHead">
                        </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // กำหนดพาธของไฟล์ CSV (ให้อยู่ในโฟลเดอร์เดียวกันกับไฟล์ HTML นี้บน GitHub)
    const csvFile = "sandbox.csv";

    // ใช้ PapaParse ดึงและแปลงข้อมูล
    Papa.parse(csvFile, {
        download: true,       // สั่งให้ดาวน์โหลดไฟล์จากพาธ
        header: true,         // ระบุว่าแถวแรกคือชื่อคอลัมน์
        skipEmptyLines: true, // ข้ามบรรทัดที่ว่างเปล่า
        complete: function(results) {
            const data = results.data;
            const headers = results.meta.fields; // รายชื่อคอลัมน์จาก CSV
            
            // อัปเดตจำนวนรายการ
            document.getElementById("rowCount").innerText = `จำนวนทั้งหมด ${data.length} รายการ`;

            // 1. สร้างหัวตาราง (Thead)
            const thead = document.getElementById("tableHead");
            let trHead = document.createElement("tr");
            headers.forEach(headerText => {
                let th = document.createElement("th");
                th.innerText = headerText;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // 2. สร้างเนื้อหาตาราง (Tbody)
            const tbody = document.getElementById("tableBody");
            data.forEach(row => {
                let tr = document.createElement("tr");
                headers.forEach(header => {
                    let td = document.createElement("td");
                    // ดึงค่าตามชื่อคอลัมน์ ถ้าไม่มีให้ใส่ค่าว่าง
                    td.innerText = row[header] ? row[header].trim() : "-";
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        },
        error: function(err) {
            console.error("พบข้อผิดพลาดในการโหลดไฟล์ CSV:", err);
            document.getElementById("tableBody").innerHTML = `
                <tr>
                    <td colspan="100%" class="text-center text-danger py-4">
                        <strong>เกิดข้อผิดพลาด:</strong> ไม่สามารถโหลดไฟล์ <code>${csvFile}</code> ได้<br>
                        (หากเปิดไฟล์นี้จากในเครื่องโดยตรง (file://) อาจติดปัญหา CORS แนะนำให้รันผ่าน Live Server หรืออัปโหลดขึ้น GitHub แล้ว)
                    </td>
                </tr>`;
            document.getElementById("rowCount").innerText = "เกิดข้อผิดพลาด";
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
